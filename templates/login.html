<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - Let's Go Event</title>


    <!-- ============================= -->
    <!-- BOOTSTRAP CSS -->
    <!-- ============================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


    <!-- ================================================= -->
    <!-- LOGIN CONTAINER -->
    <!-- ================================================= -->

    <div class="container mt-5">


        <div class="row justify-content-center">


            <div class="col-md-5">


                <!-- ================================================= -->
                <!-- LOGIN CARD -->
                <!-- ================================================= -->

                <div class="card shadow">


                    <div class="card-body p-4">


                        <!-- TITLE -->

                        <h2 class="text-center mb-4">

                            Admin Login

                        </h2>


                        <p class="text-center text-muted mb-4">

                            Let's Go Event

                        </p>



                        <!-- ================================================= -->
                        <!-- LOGIN FORM -->
                        <!-- ================================================= -->

                        <form
                            method="POST"
                            action="/login"
                        >


                            <!-- ============================= -->
                            <!-- USERNAME -->
                            <!-- ============================= -->

                            <div class="mb-3">

                                <label
                                    for="username"
                                    class="form-label"
                                >

                                    Username

                                </label>


                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control"
                                    placeholder="Enter username"
                                    required
                                >

                            </div>



                            <!-- ============================= -->
                            <!-- PASSWORD -->
                            <!-- ============================= -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >

                                    Password

                                </label>


                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter password"
                                    required
                                >

                            </div>



                            <!-- ============================= -->
                            <!-- LOGIN BUTTON -->
                            <!-- ============================= -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >

                                Login

                            </button>


                        </form>


                    </div>


                </div>


                <!-- ================================================= -->
                <!-- BACK TO WEBSITE -->
                <!-- ================================================= -->

                <div class="text-center mt-3">

                    <a
                        href="/"
                        class="text-decoration-none"
                    >

                        ← Back to Website

                    </a>

                </div>


            </div>


        </div>


    </div>



    <!-- ============================= -->
    <!-- BOOTSTRAP JAVASCRIPT -->
    <!-- ============================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


</body>

</html>
