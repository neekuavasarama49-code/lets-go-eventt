<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Booking - Let's Go Event</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        Edit Booking
                    </h3>

                </div>


                <div class="card-body p-4">


                    <form
                        method="POST"
                        action="/edit/{{ enquiry[0] }}"
                    >


                        <!-- CUSTOMER NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Customer Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ enquiry[1] }}"
                                required
                            >

                        </div>


                        <!-- PHONE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                value="{{ enquiry[2] }}"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ enquiry[3] }}"
                            >

                        </div>


                        <!-- EVENT TYPE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Event Type
                            </label>

                            <select
                                name="event_type"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Event Type
                                </option>

                                <option
                                    value="Wedding"
                                    {% if enquiry[4] == "Wedding" %}selected{% endif %}
                                >
                                    Wedding
                                </option>

                                <option
                                    value="Engagement"
                                    {% if enquiry[4] == "Engagement" %}selected{% endif %}
                                >
                                    Engagement
                                </option>

                                <option
                                    value="Birthday"
                                    {% if enquiry[4] == "Birthday" %}selected{% endif %}
                                >
                                    Birthday
                                </option>

                                <option
                                    value="Reception"
                                    {% if enquiry[4] == "Reception" %}selected{% endif %}
                                >
                                    Reception
                                </option>

                                <option
                                    value="Other"
                                    {% if enquiry[4] == "Other" %}selected{% endif %}
                                >
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- EVENT DATE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Event Date
                            </label>

                            <input
                                type="date"
                                name="event_date"
                                class="form-control"
                                value="{{ enquiry[5] }}"
                                required
                            >

                        </div>


                        <!-- GUESTS -->

                        <div class="mb-3">

                            <label class="form-label">
                                Number of Guests
                            </label>

                            <input
                                type="number"
                                name="guests"
                                class="form-control"
                                value="{{ enquiry[10] or '' }}"
                                min="1"
                            >

                        </div>


                        <!-- PACKAGE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Selected Package
                            </label>

                            <select
                                name="package"
                                class="form-select"
                            >

                                <option value="">
                                    Normal Enquiry
                                </option>

                                <option
                                    value="Basic Package"
                                    {% if enquiry[11] == "Basic Package" %}selected{% endif %}
                                >
                                    Basic Package
                                </option>

                                <option
                                    value="Standard Package"
                                    {% if enquiry[11] == "Standard Package" %}selected{% endif %}
                                >
                                    Standard Package
                                </option>

                                <option
                                    value="Premium Package"
                                    {% if enquiry[11] == "Premium Package" %}selected{% endif %}
                                >
                                    Premium Package
                                </option>

                            </select>

                        </div>


                        <!-- MESSAGE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Additional Requirements
                            </label>

                            <textarea
                                name="message"
                                class="form-control"
                                rows="5"
                                placeholder="Enter additional requirements"
                            >{{ enquiry[6] or '' }}</textarea>

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Changes
                            </button>


                            <a
                                href="/admin"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>


                    </form>


                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
