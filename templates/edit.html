<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Booking - Let's Go Event</title>


    <!-- ============================= -->
    <!-- BOOTSTRAP CSS -->
    <!-- ============================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<div class="container mt-5 mb-5">


    <!-- ================================================= -->
    <!-- EDIT BOOKING CARD -->
    <!-- ================================================= -->

    <div class="row justify-content-center">


        <div class="col-lg-8">


            <div class="card shadow">


                <!-- ============================= -->
                <!-- HEADER -->
                <!-- ============================= -->

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        ✏️ Edit Booking #{{ enquiry[0] }}
                    </h3>

                </div>



                <!-- ============================= -->
                <!-- FORM BODY -->
                <!-- ============================= -->

                <div class="card-body">


                    <form
                        method="POST"
                        action="/edit/{{ enquiry[0] }}"
                    >


                        <!-- ================================================= -->
                        <!-- CUSTOMER NAME -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label"
                            >
                                Customer Name
                            </label>


                            <input
                                type="text"
                                id="name"
                                name="name"
                                class="form-control"
                                value="{{ enquiry[1] }}"
                                required
                            >

                        </div>



                        <!-- ================================================= -->
                        <!-- PHONE -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="phone"
                                class="form-label"
                            >
                                Phone Number
                            </label>


                            <input
                                type="text"
                                id="phone"
                                name="phone"
                                class="form-control"
                                value="{{ enquiry[2] }}"
                                required
                            >

                        </div>



                        <!-- ================================================= -->
                        <!-- EMAIL -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>


                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                value="{{ enquiry[3] or '' }}"
                            >

                        </div>



                        <!-- ================================================= -->
                        <!-- EVENT TYPE -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="event_type"
                                class="form-label"
                            >
                                Event Type
                            </label>


                            <select
                                id="event_type"
                                name="event_type"
                                class="form-select"
                                required
                            >

                                <option value="Wedding"
                                    {% if enquiry[4] == "Wedding" %}
                                        selected
                                    {% endif %}
                                >
                                    Wedding
                                </option>


                                <option value="Engagement"
                                    {% if enquiry[4] == "Engagement" %}
                                        selected
                                    {% endif %}
                                >
                                    Engagement
                                </option>


                                <option value="Birthday"
                                    {% if enquiry[4] == "Birthday" %}
                                        selected
                                    {% endif %}
                                >
                                    Birthday
                                </option>


                                <option value="Reception"
                                    {% if enquiry[4] == "Reception" %}
                                        selected
                                    {% endif %}
                                >
                                    Reception
                                </option>


                                <option value="Other"
                                    {% if enquiry[4] == "Other" %}
                                        selected
                                    {% endif %}
                                >
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- ================================================= -->
                        <!-- EVENT DATE -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="event_date"
                                class="form-label"
                            >
                                Event Date
                            </label>


                            <input
                                type="date"
                                id="event_date"
                                name="event_date"
                                class="form-control"
                                value="{{ enquiry[5] }}"
                                required
                            >

                        </div>



                        <!-- ================================================= -->
                        <!-- NUMBER OF GUESTS -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="guests"
                                class="form-label"
                            >
                                Number of Guests
                            </label>


                            <input
                                type="number"
                                id="guests"
                                name="guests"
                                class="form-control"
                                value="{{ enquiry[10] or '' }}"
                                min="1"
                            >

                        </div>



                        <!-- ================================================= -->
                        <!-- PACKAGE -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="package"
                                class="form-label"
                            >
                                Package
                            </label>


                            <select
                                id="package"
                                name="package"
                                class="form-select"
                            >

                                <option
                                    value=""
                                    {% if not enquiry[11] %}
                                        selected
                                    {% endif %}
                                >
                                    Normal Enquiry
                                </option>


                                <option
                                    value="Basic Package"
                                    {% if enquiry[11] == "Basic Package" %}
                                        selected
                                    {% endif %}
                                >
                                    Basic Package
                                </option>


                                <option
                                    value="Standard Package"
                                    {% if enquiry[11] == "Standard Package" %}
                                        selected
                                    {% endif %}
                                >
                                    Standard Package
                                </option>


                                <option
                                    value="Premium Package"
                                    {% if enquiry[11] == "Premium Package" %}
                                        selected
                                    {% endif %}
                                >
                                    Premium Package
                                </option>

                            </select>

                        </div>



                        <!-- ================================================= -->
                        <!-- TOTAL AMOUNT -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="total_amount"
                                class="form-label"
                            >
                                Total Amount (₹)
                            </label>


                            <input
                                type="number"
                                name="total_amount"
                                id="total_amount"
                                class="form-control"
                                value="{{ enquiry[12] or 0 }}"
                                min="0"
                                step="1"
                                oninput="calculateBalance()"
                            >

                        </div>



                        <!-- ================================================= -->
                        <!-- ADVANCE AMOUNT -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="advance_amount"
                                class="form-label"
                            >
                                Advance Amount (₹)
                            </label>


                            <input
                                type="number"
                                name="advance_amount"
                                id="advance_amount"
                                class="form-control"
                                value="{{ enquiry[13] or 0 }}"
                                min="0"
                                step="1"
                                oninput="calculateBalance()"
                            >

                        </div>



                        <!-- ================================================= -->
                        <!-- BALANCE AMOUNT -->
                        <!-- ================================================= -->

                        <div class="mb-4">

                            <label
                                for="balance_amount"
                                class="form-label"
                            >
                                Balance Amount (₹)
                            </label>


                            <input
                                type="text"
                                id="balance_amount"
                                class="form-control bg-light"
                                value="₹{{ (enquiry[12] or 0) - (enquiry[13] or 0) }}"
                                readonly
                            >

                        </div>



                        <!-- ================================================= -->
                        <!-- ADDITIONAL REQUIREMENTS -->
                        <!-- ================================================= -->

                        <div class="mb-4">

                            <label
                                for="message"
                                class="form-label"
                            >
                                Additional Requirements
                            </label>


                            <textarea
                                id="message"
                                name="message"
                                class="form-control"
                                rows="4"
                            >{{ enquiry[6] or '' }}</textarea>

                        </div>



                        <!-- ================================================= -->
                        <!-- BUTTONS -->
                        <!-- ================================================= -->

                        <div class="d-flex gap-2">


                            <!-- SAVE -->

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                💾 Save Changes
                            </button>



                            <!-- CANCEL -->

                            <a
                                href="/view/{{ enquiry[0] }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>



                            <!-- ADMIN -->

                            <a
                                href="/admin"
                                class="btn btn-outline-primary"
                            >
                                ← Admin Dashboard
                            </a>


                        </div>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>



<!-- ================================================= -->
<!-- BALANCE CALCULATION -->
<!-- ================================================= -->

<script>

function calculateBalance() {

    let total =
        parseFloat(
            document.getElementById("total_amount").value
        ) || 0;


    let advance =
        parseFloat(
            document.getElementById("advance_amount").value
        ) || 0;


    let balance = total - advance;


    document.getElementById("balance_amount").value =
        "₹" + balance;

}

</script>


<!-- ============================= -->
<!-- BOOTSTRAP JAVASCRIPT -->
<!-- ============================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
